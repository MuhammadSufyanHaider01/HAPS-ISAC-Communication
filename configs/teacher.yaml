schema_version: 2
provider: qwen
model_id: Qwen/Qwen3.5-27B
model_revision: fc05daec18b0a78c049392ed2e771dde82bdf654
base_url: http://127.0.0.1:8000/v1
api_key_env: HAPS_TEACHER_API_KEY
prompt_version: "2.0"
num_candidates: 8
request_timeout_s: 600.0
max_retries: 3
cache_enabled: true
cache_directory: .cache/teacher_queries

sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  max_tokens: 4096
  presence_penalty: 1.5

verification:
  rollout_horizon_slots: 32
  monte_carlo_rollouts: 8
  max_monte_carlo_rollouts: 64
  rollout_batch_size: 8
  uncertainty_bootstrap_samples: 2000
  uncertainty_confidence_level: 0.95
  practical_equivalence_margin: 0.01
  shortlist_size: 3
  discount_factor: 0.995
  cvar_alpha: 0.90
  cvar_weight: 0.25
  constraint_weight: 2.0
  repair_weight: 0.25
  fallback_weight: 2.0
  quality_temperature: 0.10

candidate_pool:
  include_safe_template_bank: true
  template_cpu_fractions: [0.0, 0.5, 1.0]
  include_selectable_greedy_baseline: true
  enable_one_step_grid_oracle_diagnostic: true

dataset:
  strategy: stratified
  state_fractions:
    ordinary: 0.35
    freshness_stress: 0.25
    sensing_stress: 0.15
    secrecy_stress: 0.15
    boundary_rare: 0.10
  split_fractions:
    train: 0.70
    validation: 0.15
    test: 0.15
  maximum_rollin_slots: 32

logging:
  flush_every: 32
  retain_selected_trajectories: true
  retain_failure_trajectories: true
  trajectory_audit_fraction: 0.03
  export_parquet: true
