schema_version: 1
optimizer: adamw
learning_rate: 3.0e-4
weight_decay: 1.0e-4
batch_size: 8
gradient_accumulation_steps: 8
max_epochs: 40
gradient_clip_norm: 1.0
early_stopping_patience: 5
categorical_label_smoothing: 0.02
seed: 20260824
device: auto
precision: bf16

# The continuous term uses the same transformed density that PPO will use.
# Constraint targets are optional in the current verified view and are masked
# until per-constraint outcomes are added by active correction.
loss_weights:
  categorical: 1.0
  continuous: 1.0
  value: 0.10
  constraint: 0.10
  auxiliary: 0.0

num_scheduling_actions: 5  # four NOMA pairs plus the sensing-only action
num_ris_actions: 1         # Version 1 has RIS disabled
constraint_dim: 5
bottleneck_size: 512

# Primary 4B-class student. E4B is approximately 4.5B effective parameters
# (about 8B total including embeddings), not exactly 4B total.
student:
  model_family: gemma4
  model_id: google/gemma-4-E4B-it
  model_revision: main  # pin an immutable commit before dataset generation
  parameter_class: "4.5B effective (~8B including embeddings)"
  input_mode: causal_state_text
  output_mode: structured_hybrid_action_head
  max_sequence_length: 4096
  train_action_head: true

# Only adapters and newly initialized heads are updated during distillation.
peft:
  method: qlora
  quantization: nf4
  load_in_4bit: true
  compute_dtype: bfloat16
  freeze_base_model: true
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  gradient_checkpointing: true
  fallback_method: lora
