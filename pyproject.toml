[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haps-isac-distillation"
version = "0.1.0"
description = "Simulator-verified reasoning distillation and constrained control for HAPS-ISAC"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gymnasium>=1.0",
  "h5py>=3.11",
  "hydra-core>=1.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["haps_isac"]
